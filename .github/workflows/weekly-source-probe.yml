name: Validate weekly movers sources
on:
  pull_request:
    paths:
      - '.github/workflows/weekly-source-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test public market data HTML from hosted runner
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, re, html
          urls=[
            'https://stockanalysis.com/markets/gainers/week/',
            'https://stockanalysis.com/markets/losers/week/',
            'https://stockanalysis.com/stocks/screener/',
            'https://finviz.com/screener.ashx?v=111&f=cap_smallover,sh_avgvol_o500&o=-perf1w',
          ]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=14) as res:
                data=res.read()
                body=data.decode('utf-8','replace')
                print('URL',url,'HTTP',res.status,'bytes',len(data),'TR count',body.count('<tr'),'json-data',body.count('results_count'),'title',re.findall(r'<title[^>]*>([^<]*)</title>',body)[:1],flush=True)
            except Exception as e:
              print('URL',url,type(e).__name__,str(e),flush=True)
          PY
